<!doctype html>
<html lang="en">
<head>

  <title>optgroup-label-present — scenario fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.4; margin: 24px; }

<body>
  <h1>Scenario fixture: <code>optgroup-label-present</code></h1>

  <p class="note">Each target <code>&lt;optgroup&gt;</code> has a stable <code>id</code> of the form <code>ogl_case_NN</code>.</p>

  <div class="case" id="case_01">
    <div class="case-title">01 — PASS: optgroup with label="Europe"</div>
    <label for="ogl_select_01">Destination</label>
    <select id="ogl_select_01"><optgroup id="ogl_case_01" label="Europe"><option>Paris</option></optgroup></select>
  </div>

  <div class="case" id="case_02">
    <div class="case-title">02 — FAIL: optgroup with no label attribute</div>
    <label for="ogl_select_02">Destination</label>
    <select id="ogl_select_02"><optgroup id="ogl_case_02"><option>Tokyo</option></optgroup></select>
  </div>

  <div class="case" id="case_03">
    <div class="case-title">03 — FAIL: optgroup whose label is only spaces</div>
    <label for="ogl_select_03">Destination</label>
    <select id="ogl_select_03"><optgroup id="ogl_case_03" label="  "><option>Lima</option></optgroup></select>
  </div>

  <p class="note">End of fixture.</p>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>css-hidden-focus fixtures — many combinations</title>
</head>
<body>

<!-- ========================================================= -->
<!-- 1) NOT FLAGGED: fully visible, normal tabbable button -->
<!-- ========================================================= -->
<button id="case_visible_button">Visible</button>

<!-- ========================================================= -->
<!-- 2) cantTell: opacity:0 -->
<!-- ========================================================= -->
<button id="case_opacity_zero" style="opacity:0">Hidden</button>

<!-- ========================================================= -->
<!-- 3) cantTell: off-screen (absolute + left:-9999px) -->
<!-- ========================================================= -->
<a id="case_offscreen" href="#x" style="position:absolute; left:-9999px; top:0">Off</a>

<!-- ========================================================= -->
<!-- 4) cantTell: off-screen via text-indent technique -->
<!-- ========================================================= -->
<a id="case_text_indent_offscreen" href="#x" style="text-indent:-9999px; display:block; overflow:hidden;">Off via text-indent</a>

<!-- ========================================================= -->
<!-- 5) cantTell: clipped (clip: rect(0,0,0,0)) -->
<!-- ========================================================= -->
<button id="case_clipped" style="position:absolute; clip: rect(0,0,0,0);">Clip</button>

<!-- ========================================================= -->
<!-- 6) cantTell: zero-size + overflow hidden -->
<!-- ========================================================= -->
<button id="case_zero_size_overflow_hidden" style="width:0; height:0; overflow:hidden;">ZeroSize</button>

<!-- ========================================================= -->
<!-- 7) cantTell: multiple hints on one element (opacity:0 + offscreen) -->
<!-- ========================================================= -->
<a id="case_multi_hint" href="#x" style="opacity:0; position:absolute; left:-9999px; top:0;">Multi</a>

<!-- ========================================================= -->
<!-- 8) NOT FLAGGED: excluded, not rendered (display:none) -->
<!-- ========================================================= -->
<button id="case_display_none" style="display:none">DN</button>

<!-- ========================================================= -->
<!-- 9) NOT FLAGGED: excluded, not rendered (visibility:hidden) -->
<!-- ========================================================= -->
<button id="case_visibility_hidden" style="visibility:hidden">VH</button>

<!-- visibility:hidden must win even when opacity:0 is ALSO present on the
     same element. -->
<button id="case_opacity_and_visibility_hidden" style="opacity:0;visibility:hidden">OpVH</button>

<!-- ========================================================= -->
<!-- 10) NOT FLAGGED: excluded, not rendered ([hidden] attribute) -->
<!-- ========================================================= -->
<button id="case_hidden_attr" hidden>HA</button>

<!-- ========================================================= -->
<!-- 11) NOT FLAGGED: not tabbable (tabindex="-1" is focusable but not tabbable) -->
<!-- ========================================================= -->
<div id="case_tabindex_neg1" tabindex="-1" style="opacity:0">Programmatic focus only</div>

<!-- ========================================================= -->
<!-- 12) cantTell: hidden select/textarea/input also covered by the same candidate selector -->
<!-- ========================================================= -->
<input id="case_input_offscreen" type="text" style="position:absolute; left:-9999px; top:0;">
<select id="case_select_opacity_zero" style="opacity:0"><option>One</option></select>
<textarea id="case_textarea_clipped" style="position:absolute; clip: rect(0,0,0,0);"></textarea>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>table-duplicate-name — scenario fixture</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.4; margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .note { font-size: 12px; opacity: 0.85; margin: 8px 0 16px; }
    .case { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .case-title { font-weight: 700; margin: 0 0 8px; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>Scenario fixture: <code>table-duplicate-name</code></h1>

  <div class="case" id="case_01">
    <div class="case-title">01 — NEUTRAL: summary provides different information than the caption</div>
    <table summary="Data collected in fiscal year 2025" id="tdn_case_01">
      <caption>Sales data</caption>
      <tr><td>1</td></tr>
    </table>
  </div>

  <div class="case" id="case_02">
    <div class="case-title">02 — CANTTELL: summary duplicates the caption text</div>
    <table summary="Sales data" id="tdn_case_02">
      <caption>Sales data</caption>
      <tr><td>1</td></tr>
    </table>
  </div>

  <p class="note">End of fixture.</p>
</body>

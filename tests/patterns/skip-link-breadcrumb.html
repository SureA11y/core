<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip link past a breadcrumb – Acme component patterns</title>
<link rel="stylesheet" href="_base.css">
<style>
.skip { position: absolute; left: 8px; top: -100px; padding: 8px; color: #fff; background: #1a4b8c; }
.skip:focus { top: 8px; }
.crumbs ol { display: flex; gap: 8px; list-style: none; margin: 0 0 16px; padding: 0; }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="app"><nav aria-label="Main"><a href="/">Home</a> <a href="/about">About</a> <a href="/contact">Contact</a></nav></header>
<main>
<nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="/about">About</a></li></ol></nav>
<!-- The skip link's target is an empty anchor after the breadcrumb, as CMS
     themes place it: following the link moves focus here. -->
<a id="content" tabindex="-1"></a>
<h1>Contact us</h1>
<p>Write to us, or call during opening hours.</p>
</main>
</body>
</html>

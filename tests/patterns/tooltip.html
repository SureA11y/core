<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip – Acme component patterns</title>
<link rel="stylesheet" href="_base.css">
<style>
.tip-wrap { position: relative; display: inline-block; margin-top: 60px; }
.tip { position: absolute; bottom: calc(100% + 8px); left: 0; width: 220px; padding: 8px; color: #fff; background: #222; border-radius: 4px; }
</style>
</head>
<body>
<header class="app"><a href="#main">Acme</a><span>Pattern: Tooltip</span></header>
<main id="main">
<h1>Tooltip</h1>
<div class="tip-wrap"><button type="button" aria-describedby="tip">Help</button><div class="tip" role="tooltip" id="tip">Opens the help center in a new panel.</div></div>
</main>
</body>
</html>

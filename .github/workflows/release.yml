name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Playwright image of the locked playwright version, as in test.yml:
  # Chromium and its system libraries come installed, so no job waits on apt.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: image
        run: |
          version="$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)"
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  # Everything but the test suite: the tag, lint, format, the rule contracts,
  # the committed build and the ACT corpus.
  verify:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The checkout is owned by another user than the container's, and
      # checkout trusts it only for its own step, so git is told to trust it
      # here too.
      - name: Verify committed build artifacts are up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet; then
            echo "::error::generated files differ after a clean build; commit the rebuild"
            git --no-pager diff --stat
            exit 1
          fi
      - run: npm run validate:rules

      # The corpus the Test workflow has cached this week, as its act-corpus
      # job keys it: w3.org rate-limits GitHub's runners, so a release that
      # fetched the whole corpus cold could be refused partway. Test-case
      # pages are content-addressed, so a cached page is the page; whatever
      # the cache lacks is fetched.
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .act-cache
          key: act-corpus-w3c-${{ steps.week.outputs.key }}-${{ github.run_id }}
          restore-keys: act-corpus-w3c-${{ steps.week.outputs.key }}-

      - name: ACT corpus has no false positives
        timeout-minutes: 30
        run: node scripts/act-report.js --out="$RUNNER_TEMP/act-report.jsonld"

  # The whole test suite on the Node version that publishes, in shards side by
  # side, as test.yml runs it.
  test:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # Already in the image, so this only checks it; it downloads the build
      # if the image ever lacks the one playwright launches, rather than let
      # the Chromium tests skip.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: node scripts/run-tests.js --test-shard=${{ matrix.shard }}

  # Publishing runs on the runner itself, not in the container, once every
  # check and test passed. The package is the committed files, which verify
  # checked are what a clean build writes.
  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance

      - name: Manual run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Checks passed. Publishing skipped because this was not a tag."

name: Release

# Publishes to npm with provenance when a version tag is pushed.
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# Authentication uses npm trusted publishing (OIDC): no NPM_TOKEN is stored
# anywhere. This requires the package to be linked to this repo and workflow
# under Settings -> Trusted publisher on npmjs.com.
#
# If you ever need to fall back to a token, add an NPM_TOKEN secret and set
#   env:
#     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# on the publish step. Provenance still works that way.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing and --provenance need a recent npm; the one bundled
      # with Node 22 predates it.
      - name: Use a provenance-capable npm
        run: npm install -g npm@latest

      - run: npm ci

      # Fail before running anything expensive if the tag and the manifest
      # disagree -- publishing 1.3.0 from a tag reading v1.4.0 is the kind of
      # mistake that cannot be undone on npm.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run lint

      - name: Install browser for the test suite
        run: npx playwright install --with-deps chromium

      - run: npm test

      # src/core.js and surea11y.browser.js are generated and committed. If a
      # rebuild changes them, the tree is stale and the tarball would not match
      # the source it claims to come from -- which is the whole point of
      # publishing with provenance.
      - name: Verify committed build artifacts are up to date
        run: |
          npm run build
          if ! git diff --quiet; then
            echo "::error::generated files differ after a clean build; commit the rebuild"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance

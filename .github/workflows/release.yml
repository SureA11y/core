name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The whole test suite runs here in one job, unsplit: room for it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run lint
      # The browser, then its system libraries with room for a slow mirror, as
      # in test.yml.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npx playwright install-deps chromium
        timeout-minutes: 20
      - run: npm test

      - name: Verify committed build artifacts are up to date
        run: |
          npm run build
          if ! git diff --quiet; then
            echo "::error::generated files differ after a clean build; commit the rebuild"
            git --no-pager diff --stat
            exit 1
          fi

      # The corpus the Test workflow has cached this week, as its act-corpus
      # job keys it: w3.org rate-limits GitHub's runners, so a release that
      # fetched the whole corpus cold could be refused partway. Test-case
      # pages are content-addressed, so a cached page is the page; whatever
      # the cache lacks is fetched.
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .act-cache
          key: act-corpus-w3c-${{ steps.week.outputs.key }}-${{ github.run_id }}
          restore-keys: act-corpus-w3c-${{ steps.week.outputs.key }}-

      - name: ACT corpus has no false positives
        timeout-minutes: 30
        run: node scripts/act-report.js --out="$RUNNER_TEMP/act-report.jsonld"

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance

      - name: Manual run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Checks passed. Publishing skipped because this was not a tag."

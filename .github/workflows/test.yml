name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to a pull request makes the run for the older one moot. On main
# every commit is tested to the end: the group is the commit itself.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Playwright image of the locked playwright version: its Chromium build
  # and the system libraries that build needs come installed, so no job waits
  # on apt, which took 9 to 11 minutes on a slow mirror. The tag follows the
  # lockfile, so a playwright upgrade brings its own image.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: image
        run: |
          version="$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)"
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  # Everything but the test suite, once: lint, format and the generated files
  # read the same on every Node version, and the suite runs on each below.
  checks:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright.outputs.image }}
      # Chromium keeps its shared memory in /dev/shm, which is 64 MB in a
      # container unless it shares the host's.
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # A PR that changed a rule without committing the rebuild of src/core.js
      # and the browser bundles differs here, not only at release. The checkout
      # is owned by another user than the container's, and checkout trusts it
      # only for its own step, so git is told to trust it here too.
      - name: Committed build artifacts are up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet; then
            echo "::error::generated files differ after a clean build; commit the rebuild"
            git --no-pager diff --stat
            exit 1
          fi
      - run: npm run validate:rules
      - run: npm run coverage:check
      - run: npm run fixtures:check
      - run: npm run fixtures:markers:check
      - run: npm run docs:rule-catalog:check
      - run: npm run rule-examples:coverage:check
      - run: npm run rule-examples:outcomes:check
      - run: npm run aria-tables:check
      - run: npm run language-subtags:check

  # The whole suite on every Node version, each split into shards that run
  # side by side: one run took 11 to 17 minutes.
  test:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      # A failing shard leaves the others running, so one run shows every
      # failure.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The tests load the bundles, built here from this commit's source.
      - run: npm run build
      # Already in the image, so this only checks it; it downloads the build
      # if the image ever lacks the one playwright launches, rather than let
      # the Chromium tests skip.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: node scripts/run-tests.js --test-shard=${{ matrix.shard }}

  # CONTRIBUTING.md asks for a DCO sign-off on every commit. Dependabot's
  # pull requests are left out: a bot can't certify the DCO.
  sign-off:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..HEAD"); do
            if [ -z "$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")" ]; then
              echo "::error::$(git show -s --format='%h %s' "$sha") has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  act-corpus:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Test case pages are content-addressed, but the testcases.json listing
      # them changes, so the corpus is refetched once a week. The default
      # corpus is W3C's, the one its implementation listing scores, so the
      # key names the source: a cache filled from another corpus holds none
      # of these pages.
      #
      # w3.org rate-limits GitHub's runners, so a cold run may not fetch the
      # whole corpus. The cache is saved even when the run fails, under a key
      # of its own, and the next run restores the latest one: each run
      # fetches only what the ones before it could not.
      - uses: actions/cache/restore@v4
        with:
          path: .act-cache
          key: act-corpus-w3c-${{ steps.week.outputs.key }}-${{ github.run_id }}
          restore-keys: act-corpus-w3c-${{ steps.week.outputs.key }}-
      - name: ACT corpus has no false positives
        timeout-minutes: 30
        run: node scripts/act-report.js --out="$RUNNER_TEMP/act-report.jsonld"
      # The same test cases loaded in Chromium, as the browser bindings run
      # the engine: scripts run, linked style sheets and frames load, and the
      # page is laid out. Before the cache is saved, so the assets the pages
      # load are kept for the next run too.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: ACT corpus in Chromium has no false positives
        timeout-minutes: 30
        run: node scripts/act-report.js --runner=chromium --out="$RUNNER_TEMP/act-report-browser.jsonld"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .act-cache
          key: act-corpus-w3c-${{ steps.week.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

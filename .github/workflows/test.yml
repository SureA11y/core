name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run validate:rules
      - run: npm run coverage:check
      - run: npm run fixtures:check
      - run: npm run fixtures:markers:check
      - run: npm run docs:rule-catalog:check
      - run: npm run rule-examples:coverage:check
      - run: npm run rule-examples:outcomes:check
      - run: npm run rgaa-map:check
      - run: npm run rgaa-mapping-doc:check

  act-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Test case pages are content-addressed, but the rule pages listing them
      # change, so the corpus is refetched once a week.
      - uses: actions/cache@v4
        with:
          path: .act-cache
          key: act-corpus-${{ steps.week.outputs.key }}
      - name: ACT corpus has no false positives
        run: node scripts/act-report.js --out="$RUNNER_TEMP/act-report.jsonld"

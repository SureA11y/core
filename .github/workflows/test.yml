name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # npm test rebuilds src/core.js and the browser bundles; a PR that
      # changed a rule without committing the rebuild differs here, not only
      # at release.
      - name: Committed build artifacts are up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::generated files differ after a clean build; commit the rebuild"
            git --no-pager diff --stat
            exit 1
          fi
      - run: npm run validate:rules
      - run: npm run coverage:check
      - run: npm run fixtures:check
      - run: npm run fixtures:markers:check
      - run: npm run docs:rule-catalog:check
      - run: npm run rule-examples:coverage:check
      - run: npm run rule-examples:outcomes:check
      - run: npm run aria-tables:check
      - run: npm run language-subtags:check

  # CONTRIBUTING.md asks for a DCO sign-off on every commit. Dependabot's
  # pull requests are left out: a bot can't certify the DCO.
  sign-off:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..HEAD"); do
            if [ -z "$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")" ]; then
              echo "::error::$(git show -s --format='%h %s' "$sha") has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  act-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Test case pages are content-addressed, but the testcases.json listing
      # them changes, so the corpus is refetched once a week. The default
      # corpus is W3C's, the one its implementation listing scores.
      - uses: actions/cache@v4
        with:
          path: .act-cache
          key: act-corpus-${{ steps.week.outputs.key }}
      - name: ACT corpus has no false positives
        run: node scripts/act-report.js --out="$RUNNER_TEMP/act-report.jsonld"
